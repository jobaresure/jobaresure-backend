spring.application.name=Jobaresure-job-application

# ===================================================================
# SERVER
# ===================================================================
server.port=${SERVER_PORT:8080}

# ===================================================================
# DATABASE (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
# Schema is owned by src/main/resources/db/schema.sql — apply it once, then let
# Hibernate only VALIDATE (never alter) the schema. This stops the repeated
# "alter table ... modify column enum(...)" churn that ddl-auto=update caused:
# Hibernate's MySQL dialect regenerates native enum columns in alphabetical
# order and never matches the stored order, so "update" re-issued them on every
# boot. Use "none" instead of "validate" if you prefer to skip validation.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
# UUID keys are stored as 36-char strings (CHAR(36)); bind them as CHAR, not the
# Hibernate default of BINARY(16), so inserts match the column type.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ===================================================================
# JWT / AUTH
# Generate a strong secret (>= 32 chars / 256 bits) for production.
# ===================================================================
app.jwt.secret=${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-bytes-long-secret}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}
app.jwt.issuer=${JWT_ISSUER:jobaresure}

# ===================================================================
# CORS (Lovable / Vite frontend origins, comma-separated)
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}

# ===================================================================
# RATE LIMITING (per client IP, applied to auth & otp endpoints)
# ===================================================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:20}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:20}
app.rate-limit.refill-period-seconds=${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

# ===================================================================
# OTP (mobile verification)
# provider: mock | msg91
# ===================================================================
app.otp.length=${OTP_LENGTH:6}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}

app.sms.provider=${SMS_PROVIDER:mock}
app.sms.msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com/api/v5}
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.sms.msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:}
app.sms.msg91.sender-id=${MSG91_SENDER_ID:JOBSUR}

# ===================================================================
# EMAIL (verification & password-reset codes)
# provider: mock | smtp   (mock logs the code to the console)
# ===================================================================
app.email.provider=${EMAIL_PROVIDER:mock}
app.email.from-address=${EMAIL_FROM_ADDRESS:no-reply@jobaresure.com}
app.email.from-name=${EMAIL_FROM_NAME:Jobaresure}
app.email.smtp.host=${SMTP_HOST:}
app.email.smtp.port=${SMTP_PORT:587}
app.email.smtp.username=${SMTP_USERNAME:}
app.email.smtp.password=${SMTP_PASSWORD:}

# ===================================================================
# AI (Claude / Anthropic) - used by Resume Builder & Job Matching (later phase)
# ===================================================================
app.ai.provider=${AI_PROVIDER:claude}
app.ai.claude.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
app.ai.claude.api-key=${ANTHROPIC_API_KEY:}
app.ai.claude.model=${ANTHROPIC_MODEL:claude-opus-4-8}
app.ai.claude.fast-model=${ANTHROPIC_FAST_MODEL:claude-haiku-4-5-20251001}
app.ai.claude.max-tokens=${ANTHROPIC_MAX_TOKENS:4096}

# ===================================================================
# FILE STORAGE (Supabase Storage - S3 compatible, later phase)
# ===================================================================
app.storage.provider=${STORAGE_PROVIDER:supabase}
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:jobaresure}

# ===================================================================
# PAYMENTS (Razorpay, later phase)
# ===================================================================
app.payments.provider=${PAYMENTS_PROVIDER:razorpay}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ===================================================================
# SWAGGER / OPENAPI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
